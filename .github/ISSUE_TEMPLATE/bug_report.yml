name: Bug report
description: Report a bug in Crimson Framework
body:

- type: markdown
  attributes:
    value: |
      - Write a descriptive issue title above.
      - Check existing issues for the same behavior before opening a new report.
- type: input
  attributes:
    label: Godot version
    description: >
      Specify the Git commit hash of your Godot build.
    placeholder: 4.7.stable.official.5b4e0cb0f
  validations:
    required: true

- type: input
  attributes:
    label: godot-cpp version
    description: >
      Run `git submodule status` to get the godot-cpp revision.
    placeholder: 507ed9d840c01a3c5b2a39af8bb4000bfac30bf5
  validations:
    required: true

- type: input
  attributes:
    label: System information
    description: |
      Specify the OS version.
    placeholder: Windows 10
  validations:
    required: true

- type: textarea
  attributes:
    label: Issue description
    description: |
      Describe your issue briefly. What doesn't work, and how do you expect it to work instead?
      You can include images or videos with drag and drop, and format code blocks or logs with <code>```</code> tags.
  validations:
    required: true
