name: Build Crimson Framework
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [template_debug, template_release]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: windows
          windows-compiler: msvc
      - run: scons platform=windows arch=x86_64 target=${{ matrix.target }}
