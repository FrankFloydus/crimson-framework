name: Package Crimson Framework
on:
  workflow_dispatch:

jobs:
  addon:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: windows
          windows-compiler: msvc
      - run: scons platform=windows arch=x86_64 target=template_debug
      - run: scons platform=windows arch=x86_64 target=template_release
      - uses: actions/upload-artifact@v7
        with:
          name: crimson-framework-windows-x86_64
          path: |
            project/addons/crimson-framework/**
            !project/addons/crimson-framework/bin/*.lib
            !project/addons/crimson-framework/bin/*.exp
            !project/addons/crimson-framework/bin/*.pdb
